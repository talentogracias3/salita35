<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RULETA — Sorteo de Nombres y Ganadores</title>
<meta name="description" content="Ruleta de sorteo: hasta 250 nombres, cantidad de ganadores configurable, lista de ganadores y música al girar.">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{height:100%;overflow:hidden}
body{background:#07080f;color:#eef0ff;display:flex;flex-direction:column;touch-action:manipulation;overscroll-behavior:none}
/* fondo con luces flotantes */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bgfx .g{position:absolute;border-radius:50%;filter:blur(100px);opacity:.5}
.g1{width:46vw;height:46vw;background:#8a35ff;top:-12%;left:-8%;animation:drift1 22s ease-in-out infinite alternate}
.g2{width:40vw;height:40vw;background:#ff4d9d;bottom:-14%;right:-6%;animation:drift2 26s ease-in-out infinite alternate}
.g3{width:32vw;height:32vw;background:#28c8ff;top:34%;right:20%;opacity:.32;animation:drift1 30s ease-in-out infinite alternate-reverse}
.g4{width:34vw;height:34vw;background:#35e08a;bottom:-16%;left:18%;opacity:.3;animation:drift2 34s ease-in-out infinite alternate}
.g5{width:22vw;height:22vw;background:#ffb84d;top:-6%;right:28%;opacity:.22;animation:drift1 27s ease-in-out infinite alternate}
.bgfx::after{content:'';position:absolute;inset:0;
  background-image:
   radial-gradient(1.6px 1.6px at 12% 22%,#fff9,transparent),
   radial-gradient(1.2px 1.2px at 28% 68%,#fff7,transparent),
   radial-gradient(1.8px 1.8px at 44% 14%,#9df,transparent 60%),
   radial-gradient(1.2px 1.2px at 61% 42%,#fff8,transparent),
   radial-gradient(1.6px 1.6px at 74% 18%,#f9d,transparent 60%),
   radial-gradient(1.2px 1.2px at 86% 64%,#fff7,transparent),
   radial-gradient(1.8px 1.8px at 8% 78%,#9df,transparent 60%),
   radial-gradient(1.2px 1.2px at 52% 88%,#fff8,transparent),
   radial-gradient(1.4px 1.4px at 92% 8%,#fff6,transparent);
  animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
@keyframes drift1{to{transform:translate(9vw,7vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-7vw,-8vh) scale(1.1)}}
/* BOTON FLOTANTE PERSONALIZACION */
.pToggle{position:fixed;top:10px;left:10px;z-index:60;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(12px);color:#d8dcff;padding:10px 15px;font-size:.76rem;font-weight:800;letter-spacing:.09em;border-radius:999px}
.pToggle:hover{background:rgba(255,255,255,.16);color:#fff}
.pToggle .chev{color:#a04fff;margin-left:6px;display:inline-block;transition:transform .3s}
.pToggle.open .chev{transform:rotate(180deg)}
/* PANEL DESPLEGABLE */
.pDrop{position:fixed;top:56px;left:10px;z-index:59;width:min(90vw,350px);max-height:min(74vh,560px);overflow-y:auto;
  display:none;background:rgba(17,15,40,.92);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:17px;
  backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08)}
.pDrop.open{display:block;animation:dropIn .3s ease}
@keyframes dropIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
header{text-align:center;padding:16px 10px 4px;flex:none}
h1{font-size:clamp(1.3rem,5.5vw,2.2rem);font-weight:900;letter-spacing:.05em;
  background:linear-gradient(110deg,#ff4d9d,#a04fff,#4fe0ff,#ff4d9d);background-size:250% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 7s linear infinite;filter:drop-shadow(0 0 26px rgba(160,79,255,.35))}
@keyframes shimmer{to{background-position:250% center}}
header p{color:#9aa0d6;font-size:.74rem;margin-top:3px}
/* STAGE FIJO */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 8px}
.stageRow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;max-height:100%}
.wheelBox{position:relative;width:min(86vw,56vh,420px);aspect-ratio:1;flex:none;
  filter:drop-shadow(0 18px 55px rgba(160,79,255,.45))}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:18px solid transparent;border-right:18px solid transparent;border-top:36px solid #ff4d9d;
  filter:drop-shadow(0 4px 12px rgba(255,77,157,.8));z-index:3;
  animation:ptrPulse 2s ease-in-out infinite;transform-origin:top center}
@keyframes ptrPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.1)}}
.spinBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:27%;height:27%;border-radius:50%;
  background:linear-gradient(135deg,#ff4d9d,#a04fff);color:#fff;font-size:clamp(.8rem,3vw,1.1rem);font-weight:900;letter-spacing:.09em;
  border:4px solid #0b0d1e;z-index:4;text-shadow:0 2px 8px rgba(0,0,0,.45);
  box-shadow:0 0 0 6px rgba(255,255,255,.05),0 12px 40px rgba(255,77,157,.55),0 0 70px rgba(160,79,255,.4),
    inset 0 2px 10px rgba(255,255,255,.3),inset 0 -8px 16px rgba(0,0,0,.35);
  animation:btnGlow 2.4s ease-in-out infinite}
@keyframes btnGlow{0%,100%{box-shadow:0 0 0 6px rgba(255,255,255,.05),0 12px 40px rgba(255,77,157,.55),0 0 70px rgba(160,79,255,.4),inset 0 2px 10px rgba(255,255,255,.3),inset 0 -8px 16px rgba(0,0,0,.35)}
  50%{box-shadow:0 0 0 6px rgba(255,255,255,.09),0 12px 52px rgba(255,77,157,.8),0 0 100px rgba(160,79,255,.6),inset 0 2px 10px rgba(255,255,255,.35),inset 0 -8px 16px rgba(0,0,0,.35)}}
.spinBtn:active{transform:translate(-50%,-50%) scale(.93)}
.spinBtn:disabled{filter:grayscale(.5) brightness(.65);cursor:not-allowed}
.status{flex:none;margin:8px 12px 10px;color:#c0c5f2;font-size:.8rem;text-align:center;padding:8px 16px;max-width:94vw;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:999px;backdrop-filter:blur(10px)}
/* PANEL INTERNO */
.addRow{display:flex;gap:8px}
input[type=text]{flex:1;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);color:#fff;
  padding:12px 14px;border-radius:13px;font-size:16px;outline:none;min-width:0;transition:.25s}
input[type=text]:focus{border-color:#a04fff;box-shadow:0 0 0 4px rgba(160,79,255,.18);background:rgba(0,0,0,.45)}
button{cursor:pointer;border:none;border-radius:13px;font-weight:700;transition:.25s;font-family:inherit}
.btnAdd{background:linear-gradient(135deg,#ff4d9d,#a04fff);color:#fff;padding:12px 18px;font-size:.88rem;
  box-shadow:0 8px 22px rgba(200,60,180,.35);flex:none}
.btnAdd:hover{filter:brightness(1.15);transform:translateY(-1px)}
.hint{color:#7d84b8;font-size:.72rem;margin-top:9px}
.setWin{margin:14px 0 4px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:12px 14px}
.setWin label{font-size:.78rem;color:#c7ccf5;display:block;margin-bottom:8px}
.winCtrl{display:flex;gap:10px;align-items:center}
.winCtrl button{width:38px;height:38px;font-size:1.2rem;background:rgba(255,255,255,.09);color:#fff;font-weight:800;flex:none}
.winCtrl button:hover{background:linear-gradient(135deg,#ff4d9d,#a04fff);box-shadow:0 6px 16px rgba(200,60,180,.4)}
.winCtrl b{font-size:1.3rem;color:#ff8fbf;min-width:34px;text-align:center}
.tools{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.tools button{background:rgba(255,255,255,.07);color:#c7ccf5;padding:9px 12px;font-size:.76rem;font-weight:600}
.tools button:hover{background:rgba(255,255,255,.16);color:#fff}
.count{margin-top:13px;font-size:.76rem;color:#8d93c9;display:flex;justify-content:space-between;gap:8px}
.names{margin-top:9px;display:flex;flex-wrap:wrap;gap:7px;max-height:22vh;overflow-y:auto;padding-right:4px}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);
  border-radius:999px;padding:6px 8px 6px 12px;font-size:.8rem;max-width:100%;transition:.2s}
.chip:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.12)}
.chip .sw{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.chip b{color:#ff8fbf;font-weight:700;font-size:.76rem;padding:2px 7px;border-radius:8px;cursor:pointer}
.chip b:hover{background:rgba(255,77,157,.3)}
.empty{text-align:center;color:#7d84b8;font-size:.8rem;padding:14px 6px;font-style:italic}
/* LISTA DE GANADORES */
.winPanel{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:14px;
  width:min(88vw,265px);backdrop-filter:blur(16px);flex:none;
  box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.winPanel h3{font-size:.74rem;color:#d8dcff;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.winPanel .prog{font-size:.7rem;color:#9aa0d6;margin-bottom:10px}
.winList{display:flex;flex-direction:column;gap:7px;max-height:16vh;overflow-y:auto}
@media(min-height:800px){.winList{max-height:24vh}}
.wRow{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:12px;animation:popIn .4s cubic-bezier(.2,1.4,.4,1);
  background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.11);
  transition:.2s}
.wRow:hover{transform:translateY(-2px);border-color:rgba(255,217,61,.35);box-shadow:0 10px 24px rgba(0,0,0,.35)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.wRow .pos{background:linear-gradient(135deg,#ffd93d,#ff9a3d);color:#3a2500;font-weight:900;font-size:.62rem;
  border-radius:8px;padding:4px 8px;flex-shrink:0;white-space:nowrap;box-shadow:0 4px 12px rgba(255,180,60,.35)}
.wRow .nm{font-size:.86rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btnNew{width:100%;margin-top:12px;background:rgba(255,255,255,.07);color:#d8dcff;padding:11px;font-size:.8rem;
  border:1px solid rgba(255,255,255,.13)}
.btnNew:hover{background:rgba(255,255,255,.15);color:#fff}
/* MODAL GANADOR */
.overlay{position:fixed;inset:0;background:rgba(5,5,15,.85);backdrop-filter:blur(10px);z-index:100;display:none;
  align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(160deg,#241a4d,#12101f 65%);border:1px solid rgba(255,255,255,.16);border-radius:26px;
  padding:32px 28px;text-align:center;max-width:450px;width:100%;animation:modalIn .4s cubic-bezier(.2,1.4,.4,1);
  box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 80px rgba(160,79,255,.25),inset 0 1px 0 rgba(255,255,255,.08)}
@keyframes modalIn{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:scale(1);opacity:1}}
.modal small{color:#a66bff;letter-spacing:.32em;text-transform:uppercase;font-size:.7rem}
.modal .win{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:900;margin:12px 0 4px;color:#fff;word-break:break-word;
  text-shadow:0 4px 34px rgba(255,77,157,.4)}
.modal .gan{color:#ff4d9d;font-size:1.35rem;font-weight:900;text-shadow:0 0 22px rgba(255,77,157,.55)}
.modal .cup{font-size:3.4rem;display:block;margin-bottom:2px;animation:cupFloat 2s ease-in-out infinite}
@keyframes cupFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.modal .sub{color:#9aa0d6;font-size:.84rem;margin-top:10px}
.modal .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.modal .btns button{padding:13px 22px;font-size:.88rem}
.mPrimary{background:linear-gradient(135deg,#ff4d9d,#a04fff);color:#fff;box-shadow:0 10px 30px rgba(200,60,180,.45)}
.mPrimary:hover{filter:brightness(1.15);transform:translateY(-1px)}
.mSec{background:rgba(255,255,255,.09);color:#d8dcff;border:1px solid rgba(255,255,255,.13)}
.mSec:hover{background:rgba(255,255,255,.17)}

/* ---- MODO CELULAR ---- */
@media (max-width:760px){
  header{padding:12px 8px 2px}
  h1{font-size:1.25rem}
  header p{font-size:.66rem}
  .pToggle{position:static;display:block;margin:10px auto 0;width:fit-content;padding:9px 12px;font-size:.68rem}
  .pDrop{top:50px;left:8px;width:min(92vw,350px)}
  .stage{padding:2px 4px}
  .stageRow{flex-direction:column;gap:8px}
  .wheelBox{width:min(84vw,46vh)}
  .spinBtn{border-width:3px}
  .winPanel{width:min(94vw,430px);padding:10px 12px;border-radius:16px}
  .winPanel h3{font-size:.66rem;margin-bottom:2px}
  .winPanel .prog{font-size:.62rem;margin-bottom:7px}
  .winList{flex-direction:row;flex-wrap:wrap;gap:6px;max-height:12.5vh;justify-content:center}
  .wRow{padding:5px 10px;gap:7px;border-radius:999px}
  .wRow .pos{font-size:.56rem;padding:3px 6px;border-radius:7px}
  .wRow .nm{font-size:.76rem;white-space:nowrap}
  .btnNew{margin-top:9px;padding:9px;font-size:.74rem}
  .status{margin:6px 10px 8px;font-size:.72rem;padding:7px 13px}
  .modal{padding:26px 20px}
}

/* CONFETI */
.confetti{position:fixed;top:-16px;width:10px;height:10px;z-index:99;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="bgfx"><span class="g g1"></span><span class="g g2"></span><span class="g g3"></span><span class="g g4"></span><span class="g g5"></span></div>

<div class="pDrop" id="panel">
  <div class="addRow">
    <input type="text" id="inp" placeholder="Escribí un nombre..." maxlength="40">
    <button class="btnAdd" id="btnAdd">AGREGAR</button>
  </div>
  <p class="hint">💡 Pegá varios separados por comas. Máximo 250. Se guarda todo solo en tu dispositivo.</p>

  <div class="setWin">
    <label>🏆 Cantidad de ganadores del sorteo</label>
    <div class="winCtrl">
      <button id="btnLess">−</button>
      <b id="nWin">1</b>
      <button id="btnMore">+</button>
    </div>
  </div>

  <div class="tools">
    <button id="btnEx">Cargar ejemplo</button>
    <button id="btnShuf">🔀 Mezclar</button>
    <button id="btnClear">Borrar todo</button>
  </div>
  <div class="count"><span id="cnt">0 / 250 nombres</span><span id="msg"></span></div>
  <div class="names" id="names"></div>
</div>

<header>
  <h1>🎡 RULETA DEL SORTEO</h1>
  <p>Tocá GIRAR y que la suerte decida</p>
</header>

<button class="pToggle" id="pToggle">⚙ PERSONALIZACIÓN <span class="chev">▼</span></button>

<main class="stage">
  <div class="stageRow">
    <div class="wheelBox">
      <div class="pointer"></div>
      <canvas id="cv" width="480" height="480"></canvas>
      <button class="spinBtn" id="btnSpin">GIRAR</button>
    </div>
    <div class="winPanel">
      <h3>🏆 Ganadores</h3>
      <p class="prog" id="prog">0 de 1 ganador sorteado</p>
      <div class="winList" id="winList"></div>
      <button class="btnNew" id="btnNew" style="display:none">🔄 NUEVO SORTEO</button>
    </div>
  </div>
</main>

<p class="status" id="status">Agregá los nombres en ⚙ Personalización</p>

<div class="overlay" id="ov">
  <div class="modal">
    <span class="cup">🏆</span>
    <small>Resultado del giro</small>
    <div class="win" id="winName"></div>
    <div class="gan">¡GANÓ! 🎉</div>
    <p class="sub" id="winSub"></p>
    <div class="btns">
      <button class="mPrimary" id="btnNext">SIGUIENTE GANADOR</button>
      <button class="mSec" id="btnClose">CERRAR</button>
    </div>
  </div>
</div>

<script>
const MAX=250, KEY='ruleta_v2_nombres', KEYW='ruleta_v2_ganadores', KEYT='ruleta_v2_target';
let names=[], winners=[], target=1;
try{names=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
try{winners=JSON.parse(localStorage.getItem(KEYW))||[]}catch(e){}
try{target=Math.max(1,parseInt(localStorage.getItem(KEYT))||1)}catch(e){}

const PAL=['#ff4d9d','#ff9a3d','#ffd93d','#6be585','#4fe0ff','#4d9dff','#a04fff','#ff6b6b','#2ee6a8','#f36bff'];
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const btnSpin=document.getElementById('btnSpin'), statusEl=document.getElementById('status');
let rot=0, spinning=false, done=false;

/* ---- SIN ZOOM ---- */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
window.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
let lastTouch=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouch<=320){e.preventDefault()}lastTouch=now},false);

function save(){localStorage.setItem(KEY,JSON.stringify(names));localStorage.setItem(KEYW,JSON.stringify(winners));localStorage.setItem(KEYT,String(target))}
function colorAt(i){return PAL[i%PAL.length]}
function norm(a){a%=Math.PI*2;return a<0?a+Math.PI*2:a}

/* ---- AUDIO ---- */
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tick(){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='square';o.frequency.value=1900;
  g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+.03);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.04)}
function fanfare(big){const a=audio();if(!a)return;
  const notes=big?[523,659,784,1047,1319,1047,1319]:[523,659,784,1047];
  notes.forEach((f,i)=>{const t=a.currentTime+i*(big?.14:.12),o=a.createOscillator(),g=a.createGain();
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(big?.22:.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.5);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.55)})}

/* ---- DIBUJO ---- */
function draw(now){
  now=now||0;
  const n=names.length, R=cv.width/2-8;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();ctx.translate(cv.width/2,cv.height/2);ctx.rotate(rot);
  ctx.beginPath();ctx.arc(0,0,R+10,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
  if(n===0){
    ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fillStyle='#171335';ctx.fill();
    ctx.fillStyle='#9aa0d6';ctx.font='16px system-ui';ctx.textAlign='center';
    ctx.fillText('La ruleta está vacía',0,-R*0.55);
    ctx.font='13px system-ui';
    ctx.fillText('Abrí ⚙ Personalización y agregá nombres',0,-R*0.42);
    rimAndLights(R,now);ctx.restore();return;
  }
  const seg=Math.PI*2/n;
  for(let i=0;i<n;i++){
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,i*seg,(i+1)*seg);ctx.closePath();
    ctx.fillStyle=colorAt(i);ctx.fill();
    ctx.strokeStyle='rgba(7,8,15,.85)';ctx.lineWidth=2;ctx.stroke();
  }
  if(n<=50){
    for(let i=0;i<n;i++){
      ctx.save();ctx.rotate(i*seg+seg/2);ctx.textAlign='right';
      ctx.fillStyle='#10101c';ctx.font='bold 900 '+(n>28?'11px':'13px')+' system-ui';
      let t=names[i];if(t.length>(n>28?9:13))t=t.slice(0,(n>28?8:12))+'…';
      ctx.fillText(t,R-14,4);ctx.restore();
    }
  } else {
    ctx.save();ctx.rotate(-Math.PI/2-rot);
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 15px system-ui';ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=6;
    ctx.fillText(names.length+' participantes',0,-cv.width/2+38);ctx.restore();
    ctx.shadowBlur=0;
  }
  const grd=ctx.createRadialGradient(0,0,R*.5,0,0,R);
  grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(0,0,0,.28)');
  ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
  rimAndLights(R,now);
  ctx.restore();
}
function rimAndLights(R,now){
  const g2=ctx.createLinearGradient(-R,-R,R,R);
  g2.addColorStop(0,'#ff4d9d');g2.addColorStop(.5,'#a04fff');g2.addColorStop(1,'#4fe0ff');
  ctx.beginPath();ctx.arc(0,0,R+6,0,Math.PI*2);
  ctx.strokeStyle=g2;ctx.lineWidth=4;ctx.stroke();
  const NL=24;
  for(let k=0;k<NL;k++){
    const a=k*(Math.PI*2/NL), x=Math.cos(a)*(R+6), y=Math.sin(a)*(R+6);
    const b=.35+.65*Math.abs(Math.sin(now*2.6+k*.55));
    ctx.beginPath();ctx.arc(x,y,3.6,0,Math.PI*2);
    ctx.fillStyle='rgba(255,235,160,'+b+')';
    ctx.shadowColor='rgba(255,220,120,'+b+')';ctx.shadowBlur=10;
    ctx.fill();ctx.shadowBlur=0;
  }
}
function loop(ts){draw(ts/1000);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function idxUnder(rotv,n){const seg=Math.PI*2/n;return Math.floor(norm(-Math.PI/2-rotv)/seg)%n}

/* ---- RENDER UI ---- */
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
  const box=document.getElementById('names');box.innerHTML='';
  names.forEach((nm,i)=>{
    const c=document.createElement('div');c.className='chip';
    c.innerHTML='<span class="sw" style="background:'+colorAt(i)+';color:'+colorAt(i)+'"></span><span>'+esc(nm)+'</span><b data-i="'+i+'">✕</b>';
    c.querySelector('b').onclick=()=>{if(spinning)return;names.splice(i,1);save();render()};
    box.appendChild(c);
  });
  if(!names.length)box.innerHTML='<p class="empty">Todavía no hay nadie en la ruleta…</p>';
  document.getElementById('cnt').textContent=names.length+' / '+MAX+' nombres';
  document.getElementById('nWin').textContent=target;

  const wl=document.getElementById('winList');
  wl.innerHTML=winners.map((w,i)=>'<div class="wRow"><span class="pos">'+(i+1)+'º GANADOR</span><span class="nm">'+esc(w)+'</span></div>').join('')||'<p class="empty">Todavía no hay ganadores</p>';
  document.getElementById('prog').textContent=winners.length+' de '+target+' ganador'+(target>1?'es':'')+' sorteado'+(winners.length===1?'':'s');
  document.getElementById('btnNew').style.display=(winners.length&&!spinning)?'block':'none';

  done=winners.length>=target;
  btnSpin.disabled=spinning||names.length<2||done;
  statusEl.textContent=
    spinning?'Girando…':
    done?(target===1?'¡El ganador ya salió! 🎉':'¡Sorteo completo! Los '+target+' ganadores ya salieron 🎉'):
    names.length===0?'Agregá los nombres en ⚙ Personalización':
    names.length===1?'Con 1 solo nombre no hay sorteo, agregá otro':
    names.length>50?names.length+' participantes girando — el texto se oculta para que no se amontone':
    'Listo para girar: '+names.length+' participantes · salen '+target+' ganador'+(target>1?'es':'');
}
function showMsg(t){const m=document.getElementById('msg');m.textContent=t;m.style.color='#ff8fbf';setTimeout(()=>m.textContent='',2600)}

/* ---- SORTEO ---- */
function spin(){
  if(spinning||names.length<2||done)return;
  audio();
  spinning=true;btnSpin.disabled=true;btnSpin.textContent='...';
  const n=names.length, seg=Math.PI*2/n;
  const win=Math.floor(Math.random()*n);
  const jitter=(Math.random()*0.6-0.3)*seg;
  let tTarget=-Math.PI/2-(win+0.5)*seg-jitter;
  const turns=5+Math.floor(Math.random()*3);
  tTarget=rot+turns*Math.PI*2+norm(tTarget-rot);
  const from=rot, dist=tTarget-from, dur=4200+Math.random()*1600, t0=performance.now();
  let lastIdx=idxUnder(rot,n);
  function step(now){
    const t=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-t,4);
    rot=from+dist*e;
    const ci=idxUnder(rot,n);
    if(ci!==lastIdx){tick();lastIdx=ci}
    if(t<1)requestAnimationFrame(step);
    else{spinning=false;btnSpin.textContent='GIRAR';announce(win)}
  }
  requestAnimationFrame(step);
}
function announce(i){
  const name=names[i];
  names.splice(i,1);
  winners.push(name);
  save();render();
  document.getElementById('winName').textContent=name;
  const pos=winners.length;
  const complete=pos>=target;
  document.getElementById('winSub').textContent=complete
    ?(target===1?'Fin del sorteo':'Ese fue el '+pos+'º y último ganador. ¡Sorteo completo!')
    :'Es el '+pos+'º ganador de '+target;
  document.getElementById('btnNext').style.display=complete?'none':'inline-block';
  document.getElementById('ov').classList.add('on');
  fanfare(complete);confetti();
}
function confetti(){
  const cols=['#ff4d9d','#ffd93d','#4fe0ff','#a04fff','#6be585','#ff9a3d'];
  for(let k=0;k<70;k++){
    const d=document.createElement('div');d.className='confetti';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[k%cols.length];
    d.style.animation='fall '+(1.6+Math.random()*1.6)+'s linear '+Math.random()*0.7+'s forwards';
    d.style.transform='rotate('+Math.random()*360+'deg)';
    document.body.appendChild(d);setTimeout(()=>d.remove(),4200);
  }
}

/* ---- EVENTOS ---- */
const pBtn=document.getElementById('pToggle'), pDrop=document.getElementById('panel');
function placeDrop(){const r=pBtn.getBoundingClientRect();
  const w=Math.min(window.innerWidth*0.92,350);
  pDrop.style.left=Math.max(8,Math.min(window.innerWidth-8-w,r.left+r.width/2-w/2))+'px';
  pDrop.style.top=Math.max(8,r.bottom+8)+'px'}
pBtn.onclick=e=>{const open=pDrop.classList.toggle('open');pBtn.classList.toggle('open',open);if(open)placeDrop();e.stopPropagation()};
window.addEventListener('resize',()=>{if(pDrop.classList.contains('open'))placeDrop()});
document.addEventListener('click',e=>{
  if(!pDrop.classList.contains('open'))return;
  if(e.target.closest('#panel')||e.target.closest('#pToggle'))return;
  pDrop.classList.remove('open');pBtn.classList.remove('open');
});
document.getElementById('btnAdd').onclick=addName;
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')addName()});
function addName(){
  if(spinning)return;
  const v=document.getElementById('inp').value.trim();if(!v)return;
  const parts=v.split(',').map(s=>s.trim()).filter(Boolean);
  let added=0;
  for(const p of parts){
    if(names.length>=MAX)break;
    if(p.length>40){showMsg('Máximo 40 letras por nombre');break}
    names.push(p);added++;
  }
  if(parts.length&&names.length>=MAX)showMsg('Llegaste al máximo de '+MAX);
  save();render();document.getElementById('inp').value='';
  if(added&&parts.length>added)showMsg('Solo entraron '+added+' (máx '+MAX+')');
}
document.getElementById('btnSpin').onclick=spin;
document.getElementById('btnNext').onclick=()=>{document.getElementById('ov').classList.remove('on');spin()};
document.getElementById('btnClose').onclick=()=>document.getElementById('ov').classList.remove('on');
document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')e.target.classList.remove('on')};
document.getElementById('btnMore').onclick=()=>{if(spinning)return;target=Math.min(250,target+1);save();render()};
document.getElementById('btnLess').onclick=()=>{if(spinning)return;target=Math.max(1,target-1);save();render()};
document.getElementById('btnNew').onclick=()=>{
  if(spinning)return;
  names=names.concat(winners);
  winners=[];save();render();
};
document.getElementById('btnEx').onclick=()=>{if(spinning)return;names=['Ana','Bruno','Camila','Diego','Emma','Facundo','Gina','Hugo'];winners=[];save();render()};
document.getElementById('btnShuf').onclick=()=>{if(spinning)return;for(let i=names.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[names[i],names[j]]=[names[j],names[i]]}save();render()};
document.getElementById('btnClear').onclick=()=>{if(spinning)return;names=[];winners=[];save();render()};
render();
</script>
